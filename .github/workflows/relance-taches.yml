name: Digest hebdomadaire des tâches (déclenchement manuel)

# Le déclenchement automatique est géré par Vercel Cron (voir vercel.json,
# "0 8 * * 1" -> appelle directement /api/relance-taches). Les schedules
# GitHub Actions ont été retirés d'ici : ils étaient trop souvent décalés
# de plusieurs dizaines de minutes (parfois beaucoup plus), et les garder
# en plus du cron Vercel aurait envoyé le digest en double chaque lundi.
# Ce workflow reste utile pour un test manuel ou un rattrapage ponctuel.
on:
  workflow_dispatch:
    inputs:
      only_email:
        description: "Test : n'envoyer qu'à cette adresse (laisser vide = envoi réel à tous les collaborateurs)"
        required: false
        default: ''

jobs:
  relance-taches:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le digest des tâches
        run: |
          URL="https://calendrier-zerah.vercel.app/api/relance-taches"
          ONLY="${{ github.event.inputs.only_email }}"
          # --fail-with-body : si l'endpoint renvoie une erreur HTTP, le run
          # GitHub échoue visiblement (avant, curl renvoyait toujours succès).
          if [ -n "$ONLY" ]; then
            echo "Mode TEST : envoi uniquement à $ONLY"
            curl -sS --fail-with-body -X POST "$URL?onlyEmail=$ONLY" \
              -H "Content-Type: application/json" -d '{}'
          else
            echo "Envoi RÉEL à tous les collaborateurs concernés"
            curl -sS --fail-with-body -X POST "$URL" \
              -H "Content-Type: application/json" -d '{}'
          fi
